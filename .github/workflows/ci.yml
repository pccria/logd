name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    name: ${{ matrix.name || matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: packages/logd
            flutter: false
          - package: packages/logd
            name: packages/logd (min SDK 3.10.0)
            flutter: false
            sdk: '3.10.0'
          - package: packages/logd_dio
            flutter: false
          - package: packages/logd_html
            flutter: false
          - package: packages/logd_linters
            flutter: false
          - package: packages/logd_markdown
            flutter: false
          - package: packages/logd_network
            flutter: false
          - package: packages/logd_sqlite
            flutter: false
          - package: packages/logd_toon
            flutter: false
          - package: packages/benchmarks
            flutter: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart
        if: ${{ !matrix.flutter }}
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk || 'stable' }}

      - name: Setup Flutter
        if: ${{ matrix.flutter }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      - name: Pub get
        run: |
          cd ${{ matrix.package }}
          if [ "${{ matrix.flutter }}" = "true" ]; then
            flutter pub get
          else
            dart pub get
          fi

      - name: Analyze
        run: |
          cd ${{ matrix.package }}
          if [ "${{ matrix.flutter }}" = "true" ]; then
            flutter analyze
          else
            dart analyze
          fi

      - name: Test
        run: |
          cd ${{ matrix.package }}
          if [ -d "test" ]; then
            if [ "${{ matrix.flutter }}" = "true" ]; then
              flutter test
            else
              dart test
            fi
          fi

      - name: Compile stub parity test for web
        if: matrix.package == 'packages/logd'
        run: dart compile js packages/logd/test/handler/sink/file_sink_stub_parity_test.dart -o /tmp/parity.js

  flutter-consumer:
    name: Flutter Consumer Probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Probe logd in Flutter app
        run: |
          flutter create --empty probe
          cd probe
          flutter pub add logd --path ../packages/logd
          flutter pub get

  check-readme:
    name: Check README Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: dart pub get

      - name: Compile README snippets
        run: dart run tool/check_readme.dart


