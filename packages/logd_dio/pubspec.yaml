name: logd_dio
description: Seamless Dio HTTP logging interceptor for logd with cURL generation, security redaction, and ambient distributed tracing.
version: 0.1.5
repository: https://github.com/pccria/logd
homepage: https://github.com/pccria/logd
documentation: https://github.com/pccria/logd
issue_tracker: https://github.com/pccria/logd/issues

topics:
  - logging
  - dio
  - http
  - networking
  - interceptor

license: BSD-3-Clause
environment:
  sdk: '>=3.6.0 <4.0.0'

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

resolution: workspace

dependencies:
  dio: ^5.2.0
  logd: ^0.10.2
  meta: ^1.18.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
