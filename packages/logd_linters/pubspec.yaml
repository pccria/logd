name: logd_linters
description: >
  Custom lint rules for the logd logging library. Surfaces arena lifecycle
  constraints, formatter/decorator purity invariants, and consumer usage
  best-practices as static analysis warnings with IDE quick-fixes.
version: 0.1.6
repository: https://github.com/pccria/logd
homepage: https://github.com/pccria/logd
documentation: https://github.com/pccria/logd
issue_tracker: https://github.com/pccria/logd/issues
topics:
  - logging
  - linting
  - static-analysis
  - logd

license: BSD-3-Clause
environment:
  sdk: '>=3.6.0 <4.0.0'

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

resolution: workspace

dependencies:
  analyzer: '>=7.0.0 <9.0.0'
  custom_lint_builder: ^0.8.1
  meta: ^1.17.0

dev_dependencies:
  custom_lint: ^0.8.1
  logd:
    path: ../logd
  test: ^1.24.0
