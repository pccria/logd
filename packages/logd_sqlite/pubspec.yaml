name: logd_sqlite
description: High-performance SQLite log sink for logd featuring WAL mode, prepared statements, atomic transaction batching, retention policies, and full-text search.
version: 0.1.7
repository: https://github.com/pooriaaskarim/logd
homepage: https://github.com/pooriaaskarim/logd
documentation: https://github.com/pooriaaskarim/logd
issue_tracker: https://github.com/pooriaaskarim/logd/issues

topics:
  - logging
  - sqlite
  - persistence
  - database
  - structured-logging

license: BSD-3-Clause
environment:
  sdk: '>=3.6.0 <4.0.0'

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

resolution: workspace

dependencies:
  logd: ^0.10.0
  meta: ^1.18.0
  sqlite3: ^3.0.0

dev_dependencies:
  lints: ^5.0.0
  logd_html:
    path: ../logd_html
  logd_markdown:
    path: ../logd_markdown
  logd_toon:
    path: ../logd_toon
  test: ^1.24.0
