name: logd
description: Modular hierarchical logging for Dart and Flutter. Features modular pipeline processing, O(1) configuration resolution, and low‑overhead performance.
version: 0.10.5

repository: https://github.com/pccria/logd
homepage: https://github.com/pccria/logd
documentation: https://github.com/pccria/logd
issue_tracker: https://github.com/pccria/logd/issues
topics:
  - logging
  - logger
  - hierarchical
  - performance
  - structured-logging

license: BSD-3-Clause
environment:
  sdk: '>=3.6.0 <4.0.0'

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

resolution: workspace

dependencies:
  characters: ^1.3.0
  ffi: ^2.1.3
  matcher: ^0.12.19
  meta: ^1.18.0
  timezone: ^0.11.1
  source_maps: ^0.10.13
  source_span: ^1.10.0

dev_dependencies:
  custom_lint: ^0.8.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  logd_linters:
    path: ../logd_linters
  test: ^1.25.0
  mocktail: ^1.0.5
